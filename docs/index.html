<style>
:root {
  --bg: #121212; --surface: #1e1e1e; --surface-high: #2a2a2a;
  --gold: #D4AF37; --gold-dark: #C5A059; --text: #f5f5f5; --muted: #9e9e9e;
  --select: #D4AF37; --danger: #ff6b6b; --ok: #66BB6A; --open: #FFA726;
  color-scheme: dark;
}
:root[data-theme=light] {
  --bg: #F6F4EF; --surface: #ffffff; --surface-high: #E4DFD3;
  --gold: #B8921F; --gold-dark: #9C7A1C; --text: #1a1a1a; --muted: #6b6b6b;
  --select: #D4AF37; --danger: #d32f2f; --ok: #2E7D32; --open: #E67E00;
  color-scheme: light;
}
:root[data-theme=light] .scrim { background: rgba(0,0,0,.35); }
/* Vlakken in licht thema in het heldere goud; tekst in het donkerdere goud voor contrast. */
:root[data-theme=light] :is(.primary, .fab, .camfab, .mic:not(.aan), .modes button.on, .seg button.on, .pcode) { background: #D4AF37; }
header.top { position: relative; }
header.top .logo { width: 26px; height: 26px; border-radius: 6px; vertical-align: -5px; margin-right: 8px; }
.tandwiel { position: absolute; right: 8px; bottom: 8px; padding: 8px; color: var(--muted); opacity: .8; }
.tandwiel svg.i { width: 19px; height: 19px; }
.seg { display: flex; gap: 6px; margin-top: 8px; background: var(--surface-high); border-radius: 22px; padding: 4px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 18px; font-size: 14px; }
.seg button.on { background: var(--gold); color: #000; font-weight: 600; }
.maker { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
[hidden] { display: none !important; }
#surf { touch-action: none; }
button, a { touch-action: manipulation; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
#app { display: flex; flex-direction: column; height: 100%; }
header.top { flex: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; text-align: center;
  color: var(--gold); font-size: 24px; font-weight: 700; letter-spacing: 1.5px; border-bottom: 1px solid var(--gold-dark); }
main { flex: 1; overflow-y: auto; position: relative; }
/* Spraak en Rapport openen als eigen pagina binnen het project, met een terugknop. */
.pagina { position: fixed; inset: 0; background: var(--bg); z-index: 45; display: flex; flex-direction: column; }
.pagina > .pbody { flex: 1; overflow-y: auto; }
.pagina label:has(#spP), .pagina label:has(#rpP) { display: none; }
.pagina .selects { grid-template-columns: 1fr; }
.acties { display: flex; gap: 8px; padding: 10px 12px 0; }
.acties button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 600; border: 1px solid transparent; }
.acties button .i { color: var(--gold); }
.acties button.aan { border-color: var(--ok); color: var(--ok); }
.acties button.aan .i { color: var(--ok); }
nav.tabs { flex: none; display: flex; background: var(--surface); border-top: 1px solid rgba(212,175,55,.25); padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px); }
#instel { display: none; } /* instellingen zitten nu in de onderbalk */
.lijstkop { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; }
.lijstkop .count { margin: 0; }
.nieuwknop { display: flex; align-items: center; gap: 6px; background: var(--gold); color: #000; font-weight: 700; border-radius: 22px; padding: 9px 16px 9px 12px; font-size: 14px; }
.nieuwknop .i { width: 18px; height: 18px; }
.appstatus { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin: 22px 4px 8px; }
.appstatus span { display: inline-flex; align-items: center; gap: 6px; }
.appstatus i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.appstatus i.ok { background: var(--ok); } .appstatus i.let { background: var(--gold); }
.rcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.rcard .txt { flex: 1; min-width: 0; }
.rcard .a { font-weight: 600; } .rcard .m { color: var(--muted); font-size: 13px; }
.isec { background: var(--surface); border-radius: 14px; padding: 14px; margin-top: 12px; }
.isec h4 { margin: 0 0 8px; color: var(--gold); font-size: 12px; letter-spacing: 1.2px; display: flex; align-items: center; gap: 8px; }
.isec .rij { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.isec small { color: var(--muted); font-size: 12px; }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; color: var(--muted); font-size: 12px; }
nav.tabs .ico { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
nav.tabs button.on { color: var(--gold); font-weight: 600; }
nav.tabs button.on .ico { background: rgba(212,175,55,.18); }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sub { display: flex; align-items: center; gap: 8px; background: var(--surface); padding: 6px 8px; min-height: 56px; }
.sub .t { flex: 1; min-width: 0; }
.sub .t b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub .t small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; }
.iconbtn:active { background: var(--surface-high); }
.pad { padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 10px; }
.count { color: var(--muted); letter-spacing: .5px; }
.card { background: var(--surface); border: 1px solid var(--surface-high); border-radius: 12px; }
.pcard { display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; width: 100%; }
.pcard .fi { width: 44px; height: 44px; border-radius: 10px; background: rgba(212,175,55,.12); color: var(--gold); display: grid; place-items: center; flex: none; }
.pcard .txt { flex: 1; min-width: 0; }
.pcard .a { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .m { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .s { color: var(--gold-dark); font-size: 12px; }
.empty { text-align: center; padding: 64px 32px; color: var(--muted); }
.empty .big { color: var(--gold-dark); margin-bottom: 12px; }
.empty .big svg { width: 72px; height: 72px; stroke-width: 1.5; }
.empty h3 { color: var(--gold); margin: 0 0 8px; font-size: 20px; font-weight: 600; }
.fab { position: absolute; right: 16px; bottom: 16px; background: var(--gold); color: #000; border-radius: 16px;
  padding: 16px 20px; display: flex; align-items: center; gap: 8px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.camfab { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 76px; height: 76px; border-radius: 38px;
  background: var(--gold); color: #000; border: 4px solid var(--gold-dark); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.camfab svg { width: 36px; height: 36px; }
.info { padding: 10px 16px; }
.info .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.info .row svg { color: var(--gold); width: 20px; height: 20px; flex: none; }
.info .row .l { width: 96px; color: var(--muted); flex: none; }
.info .row .v { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.label { color: var(--gold-dark); font-size: 12px; font-weight: 600; letter-spacing: 1.2px; margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; aspect-ratio: 1.5; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
.tile .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.tile .c { color: var(--muted); font-size: 12px; }
.tile .more { position: absolute; top: 2px; right: 2px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 12px 120px; }
.thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-high); position: relative; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .weg, .viewer .weg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
.thumb .badge { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: var(--gold); font-size: 11px; padding: 1px 6px; border-radius: 8px; }
.ph { text-align: center; padding: 64px 32px; }
.ph svg.big { width: 64px; height: 64px; color: var(--gold); margin-bottom: 12px; }
.ph h3 { color: var(--gold); font-weight: 500; margin: 0 0 8px; }
.ph p { color: var(--muted); margin: 0; }
/* bladen en dialogen */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim.center { align-items: center; padding: 24px; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.sheet .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--muted); margin: 0 auto 16px; }
.dialog { background: var(--surface); border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; }
.sheet h2, .dialog h2 { margin: 0 0 18px; font-size: 22px; font-weight: 500; }
.sheet h2 { color: var(--gold); font-weight: 600; }
.field { display: block; position: relative; margin-bottom: 12px; }
.field span { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px 12px; }
.field:focus-within span { color: var(--gold); }
.field input { width: 100%; background: var(--surface-high); border: 1.5px solid transparent; border-radius: 10px; color: var(--text); padding: 13px 14px; outline: none; }
.field input:focus { border-color: var(--gold); }
.field.err input { border-color: var(--danger); }
.field .e { color: var(--danger); font-size: 12px; margin: 4px 0 0 12px; display: none; }
.field.err .e { display: block; }
.primary { width: 100%; background: var(--gold); color: #000; border-radius: 24px; padding: 13px; font-weight: 600; margin-top: 8px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.actions button { color: var(--gold); padding: 10px 12px; font-weight: 500; }
.actions button.danger { color: var(--danger); }
.actions button.primary { color: #000; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { border: 1px solid var(--gold-dark); background: var(--surface-high); border-radius: 8px; padding: 6px 12px; }
.menu button { display: flex; width: 100%; gap: 16px; align-items: center; padding: 14px 4px; text-align: left; }
.tegels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 6px; }
.tegel { background: var(--surface); border-radius: 10px; padding: 10px 4px; text-align: center; }
.tegel b { display: block; font-size: 20px; color: var(--gold); } .tegel small { color: var(--muted); font-size: 12px; }
#rpXlsx, #rpStuur { display: flex; align-items: center; justify-content: center; gap: 8px; }
button:disabled { opacity: .5; }
button.ghost { display: inline-flex; align-items: center; gap: 6px; padding: 8px; font-size: 14px; font-weight: 500; }
button.ghost .i { width: 18px; height: 18px; }
.post { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid transparent; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.post.open { border-color: var(--open); } .post.open > b { color: var(--open); }
.pcode { min-width: 52px; text-align: center; background: var(--gold); color: #000; font-weight: 600; font-size: 13px; border-radius: 6px; padding: 4px; }
.pcode.leeg { background: var(--surface-high); color: var(--muted); }
.pinfo { flex: 1; min-width: 0; } .pinfo small { color: var(--muted); font-size: 12px; } .post > b { white-space: nowrap; }
.codes { padding: 4px 0; } .codes button { display: flex; justify-content: space-between; width: 100%; padding: 11px 16px; text-align: left; }
.codes button b { color: var(--muted); font-variant-numeric: tabular-nums; } .codes button b.eigen { color: var(--gold); }
.toast { position: fixed; left: 16px; right: 16px; bottom: 96px; background: var(--surface-high); padding: 12px 16px; border-radius: 8px; z-index: 80; }
.viewer ~ .toast { top: 72px; bottom: auto; text-align: center; }
/* foto full-screen */
.viewer { position: fixed; inset: 0; background: #000; z-index: 40; display: flex; flex-direction: column; }
.viewer .vbar { flex: none; display: flex; align-items: center; gap: 4px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 4px 4px; color: #fff; }
.viewer .vbar .t { flex: 1; font-size: 16px; padding-left: 8px; }
.stage { flex: 1; position: relative; overflow: hidden; }
.surface { position: absolute; }
.surface img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.surface svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.navarrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; z-index: 2; }
.navarrow.l { left: 0; border-radius: 0 8px 8px 0; } .navarrow.r { right: 0; border-radius: 8px 0 0 8px; }
.vbottom { flex: none; background: var(--surface); padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.status { height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); text-align: center; }
.status.sel { color: var(--text); justify-content: flex-start; text-align: left; }
.status.sel .st { flex: 1; }
.vspraak { position: absolute; left: 12px; right: 12px; top: 64px; z-index: 3; font-size: 13px; color: #fff; background: rgba(0,0,0,.6); border-radius: 8px; padding: 6px 10px; pointer-events: none; }
.vspraak:empty { display: none; }
.schakel { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; }
.schakel input { width: 20px; height: 20px; accent-color: #D4AF37; }
.status.sel { height: auto; min-height: 48px; flex-direction: column; align-items: stretch; gap: 6px; }
.teller { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 4px; }
.teller button:not(.ghost) { width: 34px; height: 34px; border-radius: 17px; background: var(--surface-high); color: var(--text); font-size: 20px; line-height: 1; }
.teller input { width: 46px; height: 34px; text-align: center; background: var(--bg); color: var(--text); border: 1px solid var(--surface-high); border-radius: 8px; font-size: 16px; }
.modes { display: flex; gap: 6px; }
.modes button { flex: 1; min-width: 0; background: var(--surface-high); border-radius: 10px; padding: 5px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; white-space: nowrap; }
.modes button .i { width: 20px; height: 20px; }
.modes button.on { background: var(--gold); color: #000; font-weight: 600; }
/* stap 5: spraak, herkenning en lasermeter */
.selects { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field select, .field textarea { width: 100%; background: var(--surface-high); border: 1.5px solid transparent; border-radius: 10px; color: var(--text); padding: 13px 14px; outline: none; font: inherit; resize: vertical; }
.field textarea:focus, .field select:focus { border-color: var(--gold); }
.mic { width: 60px; height: 60px; border-radius: 50%; background: var(--gold); color: #000; border: 4px solid var(--gold-dark); display: grid; place-items: center; flex: none; transition: background .2s, box-shadow .2s; }
.mic.groot { width: 96px; height: 96px; }
.mic.groot svg { width: 42px; height: 42px; }
.mic.aan { background: #ff5252; color: #fff; box-shadow: 0 0 18px 4px rgba(255,82,82,.5); }
.melding { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 1em; }
.melding.fout { color: var(--danger); } .melding.ok { color: var(--ok); }
.statuslabel { border: 1px solid; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.statuslabel.ok { color: var(--ok); background: rgba(102,187,106,.15); }
.statuslabel.open { color: var(--open); background: rgba(255,167,38,.15); }
.statuslabel.grijs { color: var(--muted); }
.maatvakken { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.maatvak { border: 1px solid var(--gold); background: rgba(212,175,55,.10); border-radius: 10px; padding: 6px 12px; color: var(--gold); }
.maatvak.open { border-color: var(--open); background: rgba(255,167,38,.10); color: var(--open); }
.maatvak small { display: block; color: var(--muted); font-size: 11px; }
.maatvak b { font-size: 18px; font-variant-numeric: tabular-nums; }
.termrij { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.termrij .tl { width: 88px; color: var(--muted); font-size: 12px; }
.term { background: var(--surface-high); border: 1px solid; border-radius: 8px; padding: 3px 10px; font-size: 13px; }
.term.onderdeel { color: var(--text); border-color: rgba(245,245,245,.5); }
.term.schade { color: #EF9A9A; border-color: rgba(239,154,154,.6); }
.term.behandeling { color: #90CAF9; border-color: rgba(144,202,249,.6); }
.nkop { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.notitie { padding: 14px; text-align: left; width: 100%; }
.outline { width: 100%; border: 1px solid; border-radius: 22px; padding: 11px; display: flex; gap: 8px; align-items: center; justify-content: center; }
.selbar { display: flex; align-items: center; gap: 4px; width: 100%; }
.maatknop { flex: 1; background: var(--select); color: #000; border-radius: 20px; padding: 10px; display: flex; gap: 6px; align-items: center; justify-content: center; font-weight: 600; }
</style>

const FOTO_LS = 'buildcalc.foto.';
try { navigator.storage?.persist?.().catch(() => {}); } catch {}
const dbP = new Promise(res => {
  try {
    const r = indexedDB.open('buildcalc', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos');
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  } catch { res(null); }
});
async function idb(mode, fn) {
  const db = await dbP; if (!db) return null;
  return new Promise((res, rej) => {
    const tx = db.transaction('fotos', mode); const req = fn(tx.objectStore('fotos'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
const naarDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
const dataUrlNaarBlob = d => { const s = atob(d.slice(d.indexOf(',') + 1)), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new Blob([a], { type: 'image/jpeg' }); };
async function fotoBewaar(id, blob) {
  const data = typeof blob === 'string' ? blob : await naarDataUrl(blob);
  memFotos.set(id, data);
  try { if (await dbP) { await idb('readwrite', s => s.put(data, id)); try { localStorage.removeItem(FOTO_LS + id); } catch {} return true; } } catch {}
  try { localStorage.setItem(FOTO_LS + id, data); return true; }
  catch { toast('Foto kon niet blijvend worden bewaard: de opslag van deze browser is vol of geblokkeerd. Maak een back-up.'); return false; }
}
async function fotoData(id) {
  if (memFotos.has(id)) return memFotos.get(id);
  let v = null;
  try { v = await idb('readonly', s => s.get(id)); } catch {}
  // Oude opslag (blob): eenmalig omzetten naar base64.
  if (v instanceof Blob) { try { v = await naarDataUrl(v); await fotoBewaar(id, v); } catch { v = null; } }
  if (!v) try { v = localStorage.getItem(FOTO_LS + id); } catch {}
  if (typeof v === 'string' && v.startsWith('data:')) { memFotos.set(id, v); return v; }
  return null;
}
async function fotoLaad(id) { const d = await fotoData(id); return d ? dataUrlNaarBlob(d) : null; }
async function fotoWeg(ids) { for (const id of ids) { memFotos.delete(id); try { await idb('readwrite', s => s.delete(id)); } catch {} try { localStorage.removeItem(FOTO_LS + id); } catch {} } }
const fotoUrl = fotoData;
// Bij het starten alle oude foto's eenmalig omzetten.
setTimeout(async () => { for (const p of projecten) for (const s of p.submappen) for (const f of s.fotos) await fotoData(f.id); }, 1500);

// Maakt grote camerafoto's kleiner, zodat ze snel laden en weinig ruimte innemen.
// Foto's kleiner opslaan: langste zijde 2000 px, JPEG 80%. Lijnen staan in verhoudingen (0-1) en blijven dus kloppen.
const FOTO_MAX = 2000, FOTO_KWALITEIT = 0.8;
// Breedte en hoogte uit de kop van een JPEG, zonder de foto te decoderen.
async function jpegMaat(blob) {
  const b = new Uint8Array(await blob.slice(0, 262144).arrayBuffer());
  if (b[0] !== 0xFF || b[1] !== 0xD8) return null;
  for (let i = 2; i + 9 < b.length;) {
    if (b[i] !== 0xFF) return null;
    const m = b[i + 1];
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return [(b[i + 7] << 8) | b[i + 8], (b[i + 5] << 8) | b[i + 6]];
    i += 2 + ((b[i + 2] << 8) | b[i + 3]);
  }
  return null;
}

}

const VLAKKEN = new Set(['Kozijn', 'Raam', 'Deur', 'Paneel', 'Wand', 'Plafond', 'Luik']);

const TIENTALLEN = { twintig: 20, dertig: 30, veertig: 40, vijftig: 50, zestig: 60, zeventig: 70, tachtig: 80, negentig: 90 };
const EENHEDEN = { een: 1, 'één': 1, twee: 2, drie: 3, vier: 4, vijf: 5, zes: 6, zeven: 7, acht: 8, negen: 9 };

const WB = '(?<![\\p{L}\\d])', WE = '(?![\\p{L}\\d])';
const re = (s, f = 'u') => new RegExp(s.replace(/\\b\((?!\?)/g, WB + '(').replace(/\)\\b/g, ')' + WE), f);

function normaliseer(invoer) {
  let t = ' ' + invoer.toLowerCase() + ' ';
  t = t.replace(/[eé]én/g, '1'); // "één" is altijd 1, "een" meestal een lidwoord
  t = t.replace(/(\d),(\d)/g, '$1.$2').replace(/[!?;:]/g, ' ').replace(/\.(?!\d)/g, ' ').replaceAll(',', ' ');
  t = t.replace(re(`\\b(${Object.keys(EENHEDEN).join('|')})[eë]n(${Object.keys(TIENTALLEN).join('|')})\\b`, 'gu'),
    (_, a, b) => String(EENHEDEN[a] + TIENTALLEN[b]));
  t = t.replace(re(`\\b(${[...Object.keys(GETALLEN), ...Object.keys(TIENTALLEN)].join('|')})\\b`, 'gu'),
    (_, w) => String(GETALLEN[w] ?? TIENTALLEN[w]));

  t = t.replace(re(`\\b(een)(?=\\s+(?:komma|meter|m|cm|mm|centimeter|millimeter|${R_BIJ})${WE})`, 'gu'), '1');
  t = t.replace(re(`(?<=${WB}${R_BIJ}\\s)\\b(een)\\b`, 'gu'), '1');
  t = t.replace(/(\d+)\s+komma\s+(\d+)/g, '$1.$2');
  t = t.replace(/\b(\d+)\s*(?:meter|m)\s+(\d{1,2})\b(?!\s*(?:\.\d|mm|cm|m\b|meter|millimeter|centimeter))/g,
    (_, a, b) => `${a}.${b.padEnd(2, '0')} meter`);

function naarMeter(getal, eenheid) {
  const v = parseFloat(getal);
  if (eenheid === 'mm' || eenheid === 'millimeter') return v / 1000;
  if (eenheid === 'cm' || eenheid === 'centimeter') return v / 100;
  if (eenheid === 'm' || eenheid === 'meter') return v;
  if (getal.includes('.') || v < 10) return v;
  return v < 1000 ? v / 100 : v / 1000;
}

function vervang(t, m) { return t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length); }

// ---------- leren van correcties (alleen op dit toestel) ----------
// Woordverbeteringen: wat de spraakherkenning verkeerd hoort en hoe je het verbeterde.
// Eigen woorden: een onbekend woord en welke term het betekent.
const LEER_KEY = 'buildcalc.geleerd';
let geleerd = { vervangingen: [], woorden: {} };
try { geleerd = { vervangingen: [], woorden: {}, ...JSON.parse(localStorage.getItem(LEER_KEY) || '{}') }; } catch {}

const escRe = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const termenMetGeleerd = () => TERMEN.map(([naam, soort, vormen]) =>
  [naam, soort, [...vormen, ...Object.entries(geleerd.woorden).filter(([, t]) => t === naam).map(([w]) => escRe(w))]]);
const isBekendWoord = w => w in geleerd.woorden || TERMEN.some(d => d[2].includes(w));
const woordSleutel = w => w.toLowerCase().replace(/^[.,!?;:"]+|[.,!?;:"]+$/g, '');
const vervangingTekst = v => `${v.van} → ${v.naar}`;
function verschillen(a, b) {
  const x = a.split(/\s+/).filter(Boolean), y = b.split(/\s+/).filter(Boolean);
  const kx = x.map(woordSleutel), ky = y.map(woordSleutel);
  const l = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) for (let j = y.length - 1; j >= 0; j--)
    l[i][j] = kx[i] === ky[j] ? l[i + 1][j + 1] + 1 : Math.max(l[i + 1][j], l[i][j + 1]);
  const uit = [], weg = [], erbij = [];
  const sluit = () => {
    const van = weg.map(woordSleutel).filter(Boolean).join(' '), naar = erbij.join(' ').replace(/^[.,!?;:"]+|[.,!?;:"]+$/g, '');
    if (van && naar) uit.push([van, naar]);
    weg.length = 0; erbij.length = 0;
  };
  let i = 0, j = 0;
  while (i < x.length || j < y.length) {
    if (i < x.length && j < y.length && kx[i] === ky[j]) { sluit(); i++; j++; }
    else if (j < y.length && (i === x.length || l[i][j + 1] >= l[i + 1][j])) erbij.push(y[j++]);
    else weg.push(x[i++]);
  }
  sluit(); return uit;
}
// Onthoudt vervangen woorden; losse toevoegingen en gewijzigde getallen of termen niet.
function leer(gehoord, verbeterd) {
  const nieuw = [];
  for (const [van, naar] of verschillen(gehoord, verbeterd)) {
    const vw = van.split(' ');
    if (!/\p{L}/u.test(van) || vw.length > 4 || naar.split(' ').length > 6) continue;
    if (vw.some(isBekendWoord) || woordSleutel(naar) === van) continue;
    let v = geleerd.vervangingen.find(x => x.van === van);
    if (v) { v.naar = naar; v.keer++; } else geleerd.vervangingen.push(v = { van, naar, keer: 1 });
    nieuw.push(v);
  }
  if (nieuw.length) bewaarGeleerd();
  return nieuw;
}
function verbeter(tekst) {
  const toegepast = [];
  for (const v of [...geleerd.vervangingen].sort((a, b) => b.van.length - a.van.length)) {
    const r = new RegExp(`(?<![\\p{L}\\d])${v.van.split(' ').map(escRe).join('\\s+')}(?![\\p{L}\\d])`, 'giu');
    if (r.test(tekst)) { tekst = tekst.replace(r, v.naar); toegepast.push(v); }
  }
  return [tekst, toegepast];
}

const VULWOORDEN = new Set(['bij', 'van', 'het', 'een', 'met', 'aan', 'meter', 'centimeter', 'millimeter', 'keer', 'maal', 'breedte', 'hoogte',

const aantalGeleerd = () => geleerd.vervangingen.length + Object.keys(geleerd.woorden).length + Object.keys(eigenCodes).length;
function toonGeleerd() {

    ${geleerd.vervangingen.length ? '<div class="label">WOORDVERBETERINGEN</div>' + geleerd.vervangingen.map((v, i) => regel(vervangingTekst(v), v.keer === 1 ? '1 keer verbeterd' : `${v.keer} keer verbeterd`, `data-v="${i}"`)).join('') : ''}

function herken(invoer) {
  let t = normaliseer(invoer);
  const termen = [], ontbrekend = [];
  const termen_ = termenMetGeleerd();
  for (const [naam, soort, vormen] of termen_.filter(d => d[1] === 'behandeling')) {
    const m = re(`\\b(\\d+)\\s*(?:x|×|keer|maal)\\s*(${vormen.join('|')})\\b`).exec(t);
    if (m) { termen.push({ naam, soort, aantal: +m[1] }); t = vervang(t, m); }
  }
  for (const [naam, soort, vormen] of termen_) {
    if (termen.some(x => x.naam === naam)) continue;
    if (re(`\\b(${vormen.join('|')})\\b`).test(t)) termen.push({ naam, soort });
  }
  const r = { breedte: null, hoogte: null, lengte: null, diepte: null };
  const MAAT = `(${R_GETAL})\\s*(${R_EENHEID})?`;
  const pm = new RegExp(`${MAAT}\\s*${R_BIJ}\\s*${MAAT}`).exec(t);
  if (pm) {
    const e1 = pm[2], e2 = pm[4];
    const erft = e1 && !((e1 === 'm' || e1 === 'meter') && parseFloat(pm[3]) >= 10);
    r.breedte = naarMeter(pm[1], e1 ?? e2);
    r.hoogte = naarMeter(pm[3], e2 ?? (erft ? e1 : undefined));
    t = vervang(t, pm);
  } else {
    const half = new RegExp(`${MAAT}\\s*${R_BIJ}(?!\\s*\\d)`).exec(t);
    if (half) { r.breedte = naarMeter(half[1], half[2]); ontbrekend.push('hoogte'); t = vervang(t, half); }
  }
  const LABELS = { breedte: 'breedte', breed: 'breedte', hoogte: 'hoogte', hoog: 'hoogte',
    lengte: 'lengte', lang: 'lengte', diepte: 'diepte', diep: 'diepte' };
  const zet = (soort, w) => { r[soort] = w; const i = ontbrekend.indexOf(soort); if (i >= 0) ontbrekend.splice(i, 1); };
  const LW = Object.keys(LABELS).join('|');
  for (const m of [...t.matchAll(re(`\\b(${LW})\\b(?:\\s+(?:is|van|de))*\\s*${MAAT}`, 'gu'))].reverse()) {
    zet(LABELS[m[1]], naarMeter(m[2], m[3])); t = vervang(t, m);
  }
  for (const m of [...t.matchAll(re(`${MAAT}\\s*(${LW})\\b`, 'gu'))].reverse()) {
    zet(LABELS[m[3]], naarMeter(m[1], m[2])); t = vervang(t, m);
  }
  for (const m of t.matchAll(re('\\b(breedte|hoogte|lengte|diepte)\\b', 'gu'))) {
    if (r[m[1]] == null && !ontbrekend.includes(m[1])) ontbrekend.push(m[1]);
  }
  const onderdelen = termen.filter(x => x.soort === 'onderdeel');
  const isVlak = onderdelen.some(x => VLAKKEN.has(x.naam));
  for (const m of t.matchAll(new RegExp(`(?<![\\w.])${MAAT}(?![\\w.])`, 'g'))) {
    const w = naarMeter(m[1], m[2]);
    if (isVlak && r.breedte == null) r.breedte = w;
    else if (isVlak && r.hoogte == null) { r.hoogte = w; const i = ontbrekend.indexOf('hoogte'); if (i >= 0) ontbrekend.splice(i, 1); }
    else if (r.lengte == null && r.breedte == null && r.hoogte == null) r.lengte = w;
  }
  const vraag = /\b(vraagteken|onbekend|weet ik niet|nog meten|later meten|niet te meten|nog opmeten)\b/;
  const heeftMaat = ['breedte', 'hoogte', 'lengte', 'diepte'].some(k => r[k] != null);
  if (isVlak && r.breedte != null && r.hoogte == null && !ontbrekend.includes('hoogte')) ontbrekend.push('hoogte');
  if (!heeftMaat && !ontbrekend.length && (onderdelen.length || vraag.test(t))) ontbrekend.push('maat');
  if (heeftMaat && vraag.test(t) && !ontbrekend.length) ontbrekend.push('maat');
  const status = ontbrekend.length ? 'open' : heeftMaat ? 'compleet' : 'opmerking';
  const velden = [];
  for (const k of ['breedte', 'hoogte', 'lengte', 'diepte']) {
    if (r[k] != null || ontbrekend.includes(k)) velden.push([k[0].toUpperCase() + k.slice(1), r[k] != null ? formatMeter(r[k]) : '?']);
  }
  if (ontbrekend.includes('maat')) velden.push(['Maat', '?']);
  return { tekst: invoer.trim(), ...r, termen, ontbrekend, status, velden,
    eersteMaat: r.breedte ?? r.lengte ?? r.hoogte ?? r.diepte };
}

// ---------- spraakherkenning (ingebouwd in de browser, gratis, geen API-sleutel) ----------
// ---------- Android-app (Capacitor) ----------
// In de app draait deze pagina in een WebView. Spraak, Bluetooth en bestanden lopen daar via de
// ingebouwde plug-ins; in de browser blijft alles zoals het was.
const APP_VERSIE = '2026.10.19-9';
const UPDATE_URL = 'https://buildcalc-pro.github.io/buildcalc/';
const Native = window.Capacitor?.isNativePlatform?.() ? window.Capacitor : null;
const plugins = {};
const plugin = naam => Native ? (plugins[naam] ??= Native.registerPlugin(naam)) : null;
const naarHex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
const uitHex = hex => { const h = String(hex || '').replace(/[^0-9a-f]/gi, ''), a = new Uint8Array(h.length / 2); for (let i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return new DataView(a.buffer); };

// Spraak via de spraakherkenning van Android.
const NativeSpraak = {
  laatste: '', lijst: [],
  async start(spraak, onTekst) {
    const sr = plugin('SpeechRecognition');
    const { available } = await sr.available().catch(() => ({ available: false }));
    if (!available) throw new Error('Op deze telefoon is geen spraakherkenning beschikbaar.');
    const r = await sr.requestPermissions().catch(() => null);
    if (r && r.speechRecognition && r.speechRecognition !== 'granted') throw new Error('Geef BuildCalc toestemming voor de microfoon in de instellingen van Android.');
    await this.stopLuisteren();
    this.laatste = '';
    this.lijst.push(await sr.addListener('partialResults', d => { const t = (d.matches?.[0] || '').trim(); if (t) { this.laatste = t; onTekst(t, false); } }));
    this.lijst.push(await sr.addListener('listeningState', d => { if (d.status === 'stopped') { if (this.laatste) onTekst(this.laatste, true); spraak.aan = false; spraak.melden(); this.stopLuisteren(); } }));
    spraak.aan = true; spraak.melden();
    const res = await sr.start({ language: 'nl-NL', maxResults: 1, partialResults: true, popup: false });
    const t = res?.matches?.[0]; if (t) { this.laatste = t; onTekst(t, true); }
  },
  async stopLuisteren() { const l = this.lijst; this.lijst = []; for (const x of l) try { await x.remove(); } catch {} },
  stop() { plugin('SpeechRecognition')?.stop().catch(() => {}); },
};

// Bestanden: opslaan in de app en aanbieden via het deelmenu van Android (mail, Drive, WhatsApp).
async function nativeBewaar(blob, naam, { stil = false } = {}) {
  const fs = plugin('Filesystem'), data = await naarBase64(blob);
  if (stil) { await appBackupBewaar(naam, data); return; }
  const { uri } = await fs.writeFile({ path: naam, data, directory: 'CACHE' });
  await plugin('Share').share({ title: naam, files: [uri] }).catch(e => { if (!/cancel/i.test(e?.message || '')) throw e; });
}

// Back-ups in de app: een eigen mapje "backups" binnen BuildCalc, niet in Downloads.
// Alleen de app zelf ziet deze map; via "Back-up naar Google Drive" zet je er een kopie buiten.
const APP_BACKUPS = 'backups', APP_BACKUPS_HOUD = 30;
async function appBackups() {
  try {
    const r = await plugin('Filesystem').readdir({ path: APP_BACKUPS, directory: 'DATA' });
    return (r?.files || []).map(f => typeof f === 'string' ? { name: f, mtime: 0 } : f).filter(f => /\.json$/i.test(f.name))
      .sort((a, b) => (+b.mtime || 0) - (+a.mtime || 0) || b.name.localeCompare(a.name));
  } catch { return []; }
}
async function appBackupBewaar(naam, data) {
  const fs = plugin('Filesystem');
  await fs.writeFile({ path: `${APP_BACKUPS}/${naam}`, data, directory: 'DATA', recursive: true });
  // Alleen de nieuwste 30 bewaren, zodat het mapje niet blijft groeien.
  for (const f of (await appBackups()).slice(APP_BACKUPS_HOUD)) await fs.deleteFile({ path: `${APP_BACKUPS}/${f.name}`, directory: 'DATA' }).catch(() => {});
}
async function appBackupLees(naam) {
  const r = await plugin('Filesystem').readFile({ path: `${APP_BACKUPS}/${naam}`, directory: 'DATA', encoding: 'utf8' });
  return typeof r.data === 'string' ? r.data : await r.data.text();
}

// Live update: bij het starten kijken of er op GitHub Pages een nieuwere versie staat.
// De nieuwe versie draait op hetzelfde adres in de app, dus projecten, foto's, metingen en
// TopCalc-codes (localStorage en IndexedDB) blijven gewoon staan.
const versieGetal = v => String(v).split(/[.-]/).map(n => +n || 0);
const nieuwer = (a, b) => { const x = versieGetal(a), y = versieGetal(b); for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
async function zoekUpdate(handmatig = false) {
  const up = plugin('CapacitorUpdater'); if (!up) return;
  const zet = (s, v) => { UPD.status = s; if (v) UPD.versie = v; UPD.melden(); };
  try { await up.notifyAppReady(); } catch {}
  if (!navigator.onLine) { zet('offline'); if (handmatig) toast('Geen internet. Probeer het later opnieuw.'); return; }
  zet('zoeken');
  try {
    const info = await (await fetch(UPDATE_URL + 'versie.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (!info?.versie || !nieuwer(info.versie, APP_VERSIE)) { zet('actueel'); if (handmatig) toast('Je hebt de nieuwste versie.'); return; }
    toast(`Nieuwe versie ${info.versie} wordt gedownload…`);
    const bundel = await up.download({ url: new URL(info.zip, UPDATE_URL).href, version: info.versie });
    zet('nieuw', info.versie);
    if (!await bevestig('Nieuwe versie klaar', `Versie ${info.versie} staat klaar. Je projecten en foto's blijven bewaard. Nu herstarten?`, { ja: 'Nu herstarten', nee: 'Later', klasse: 'primary' })) {
      await up.next({ id: bundel.id }); toast('De nieuwe versie start de volgende keer dat je de app opent.'); return;
    }
    if (projecten.length) await backupMaken(null, true);
    await up.set({ id: bundel.id });
  } catch (e) { console.warn('Update zoeken mislukt', e); zet('fout'); if (handmatig) toast('Updates zoeken lukte niet.'); }
}

const Spraak = {
  rec: null, aan: false, fout: null, luisteraars: new Set(),
  get beschikbaar() { return !!(Native || window.SpeechRecognition || window.webkitSpeechRecognition); },
  melden() { this.luisteraars.forEach(f => f()); },
  start(onTekst) {
    this.fout = null;
    if (Native) { NativeSpraak.start(this, onTekst).catch(e => { this.fout = e.message || String(e); this.aan = false; this.melden(); }); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { this.fout = 'Deze browser heeft geen spraakherkenning. Gebruik Chrome of Safari, of typ de tekst.'; return this.melden(); }
    try {
      const r = new SR(); this.rec = r;
      r.lang = 'nl-NL'; r.interimResults = true; r.continuous = false;
      r.onresult = e => {
        const tekst = [...e.results].map(x => x[0].transcript).join(' ').trim();
        onTekst(tekst, e.results[e.results.length - 1].isFinal);
      };
      r.onerror = e => {
        this.fout = { 'not-allowed': 'Geef de pagina toestemming voor de microfoon. Open hem in Chrome of Safari als dat hier niet lukt.',
          'service-not-allowed': 'Spraakherkenning is hier geblokkeerd. Open de pagina in Chrome of Safari, of typ de tekst.',
          'no-speech': 'Ik heb niets gehoord. Probeer het nog eens.',
          network: 'Spraakherkenning heeft hier internet nodig. Typ de tekst of probeer het later.' }[e.error]
          || 'Spraakherkenning gaf een fout: ' + e.error;
        this.melden();
      };
      r.onend = () => { this.aan = false; this.melden(); };
      r.start(); this.aan = true; this.melden();
    } catch (e) { this.fout = 'Spraakherkenning starten mislukt: ' + e.message; this.aan = false; this.melden(); }
  },
  stop() { if (Native) NativeSpraak.stop(); try { this.rec?.stop(); } catch {} this.aan = false; this.melden(); },
};

// ---------- Bluetooth-lasermeter (Leica DISTO en Bosch GLM) ----------
// Elke meter heeft een of meer meetkanalen. Oudere DISTO's sturen de afstand op 3ab10101,
// nieuwere (zoals de D2) op 3ab1010d. Vinden we geen bekend kanaal, dan luisteren we op elk
// kanaal van de service dat meldingen stuurt en lezen alleen berichten van precies 4 bytes.
const disto = id => `3ab101${id}-f831-4395-b29d-570977d5bf94`;
const float32 = (dv, o) => { if (dv.byteLength < o + 4) return null; const v = dv.getFloat32(o, true); return v > 0 && v < 300 ? v : null; };
const LASER_PROTOCOLLEN = [
  { merk: 'Leica DISTO', service: disto('00'), kanalen: [disto('01'), disto('0d')], vrij: true,
    decodeer: (dv, bekend) => bekend || dv.byteLength === 4 ? float32(dv, 0) : null },
  { merk: 'Bosch GLM', service: '02a6c0d0-0451-4000-b000-fb3210111989', kanalen: ['02a6c0d1-0451-4000-b000-fb3210111989'],
    start: [0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A],
    decodeer: dv => (dv.byteLength >= 11 && dv.getUint8(0) === 0xC0 && dv.getUint8(1) === 0x55 && dv.getUint8(2) === 0x10 && dv.getUint8(3) === 0x06)
      ? float32(dv, 7) : null },
];
const wacht = ms => new Promise(r => setTimeout(r, ms));
const Laser = {
  status: 'los', naam: null, fout: null, device: null, luisteraars: new Set(), opMeting: null, laatste: 0,
  melden() { this.luisteraars.forEach(f => f()); },
  // Android meldt de services soms pas een moment na het verbinden; daarom een paar pogingen.
  async zoekService(device) {
    let fout;
    for (let poging = 0; poging < 3; poging++) {
      try {
        const server = device.gatt.connected ? device.gatt : await device.gatt.connect();
        for (const p of LASER_PROTOCOLLEN) {
          try { return [p, await server.getPrimaryService(p.service)]; } catch (e) { fout = e; }
        }
      } catch (e) { fout = e; }
      await wacht(700);
    }
    throw new Error('geen meetservice gevonden (' + (fout?.message || 'onbekend') + ')');
  },
  // In de app via de Bluetooth-plug-in; dezelfde meters en dezelfde berichten als in Chrome.
  async verbindNative() {
    const ble = plugin('BluetoothLe');
    try {
      this.status = 'zoeken'; this.melden();
      await ble.initialize({ androidNeverForLocation: true });
      const d = await ble.requestDevice({ optionalServices: LASER_PROTOCOLLEN.map(p => p.service) }).catch(async e => {
        if (/cancel/i.test(e?.message || '')) throw Object.assign(new Error('geen meter'), { name: 'NotFoundError' }); throw e; });
      this.status = 'verbinden'; this.melden();
      await ble.addListener(`disconnected|${d.deviceId}`, () => { this.status = 'los'; this.melden(); });
      await ble.connect({ deviceId: d.deviceId, timeout: 15000 });
      const { services } = await ble.getServices({ deviceId: d.deviceId });
      let proto, svc;
      for (const p of LASER_PROTOCOLLEN) { svc = services.find(x => x.uuid.toLowerCase() === p.service); if (svc) { proto = p; break; } }
      if (!proto) throw new Error('geen meetservice gevonden');
      const meldend = svc.characteristics.filter(c => c.properties.notify || c.properties.indicate);
      let kanalen = meldend.filter(c => proto.kanalen.includes(c.uuid.toLowerCase()));
      if (!kanalen.length && proto.vrij) kanalen = meldend;
      if (!kanalen.length) throw new Error('geen meetkanaal gevonden');
      for (const ch of kanalen) {
        const bekend = proto.kanalen.includes(ch.uuid.toLowerCase());
        await ble.addListener(`notification|${d.deviceId}|${svc.uuid}|${ch.uuid}`, ({ value }) => {
          const m = proto.decodeer(uitHex(value), bekend);
          if (m == null || Date.now() - this.laatste < 500) return;
          this.laatste = Date.now();
          this.opMeting?.(Math.round(m * 10000) / 10000);
        });
        try { await ble.startNotifications({ deviceId: d.deviceId, service: svc.uuid, characteristic: ch.uuid }); } catch (e) { if (kanalen.length === 1) throw e; }
      }
      if (proto.start) await ble.write({ deviceId: d.deviceId, service: svc.uuid, characteristic: kanalen[0].uuid, value: naarHex(proto.start) });
      this.device = { native: d.deviceId }; this.naam = d.name || proto.merk; this.status = 'verbonden';
    } catch (e) {
      this.status = 'fout';
      this.fout = e.name === 'NotFoundError' ? 'Geen lasermeter gekozen.' : 'Verbinden mislukt: ' + (e.message || e);
    }
    this.melden();
  },
  async verbind() {
    this.fout = null;
    if (Native) return this.verbindNative();
    if (!navigator.bluetooth) {
      this.status = 'fout';
      this.fout = 'Deze browser kan geen Bluetooth gebruiken. Op Android werkt het in Chrome; op iPhone niet in de browser, wel in de app.';
      return this.melden();
    }
    try {
      this.status = 'zoeken'; this.melden();
      const device = await navigator.bluetooth.requestDevice({
        filters: [...LASER_PROTOCOLLEN.map(p => ({ services: [p.service] })), { namePrefix: 'DISTO' }],
        optionalServices: LASER_PROTOCOLLEN.map(p => p.service),
      });
      this.status = 'verbinden'; this.melden();
      const [proto, svc] = await this.zoekService(device);
      const alle = await svc.getCharacteristics();
      const meldend = alle.filter(c => c.properties.notify || c.properties.indicate);
      let kanalen = meldend.filter(c => proto.kanalen.includes(c.uuid.toLowerCase()));
      if (!kanalen.length && proto.vrij) kanalen = meldend;
      if (!kanalen.length) throw new Error('geen meetkanaal gevonden. Kanalen: ' + (alle.map(c => c.uuid.slice(4, 8)).join(', ') || 'geen'));
      for (const ch of kanalen) {
        const bekend = proto.kanalen.includes(ch.uuid.toLowerCase());
        ch.addEventListener('characteristicvaluechanged', e => {
          const m = proto.decodeer(e.target.value, bekend);
          // Sommige meters sturen dezelfde meting op twee kanalen: binnen een halve seconde negeren.
          if (m == null || Date.now() - this.laatste < 500) return;
          this.laatste = Date.now();
          this.opMeting?.(Math.round(m * 10000) / 10000);
        });
        try { await ch.startNotifications(); } catch (e) { if (kanalen.length === 1) throw e; }
      }
      if (proto.start) await kanalen[0].writeValue(new Uint8Array(proto.start));
      device.addEventListener('gattserverdisconnected', () => { this.status = 'los'; this.melden(); });
      this.device = device; this.naam = device.name || proto.merk; this.status = 'verbonden';
    } catch (e) {
      this.status = 'fout';
      this.fout = e.name === 'NotFoundError' ? 'Geen lasermeter gekozen.' :
        e.name === 'SecurityError' ? 'Bluetooth is hier geblokkeerd. Open de pagina via de https-link in Chrome op Android.' :
        'Verbinden mislukt: ' + e.message;
    }
    this.melden();
  },
  verbreek() { try { if (this.device?.native) plugin('BluetoothLe').disconnect({ deviceId: this.device.native }); else this.device?.gatt.disconnect(); } catch {} this.status = 'los'; this.melden(); },
};

// ---------- weergave van een herkende meting ----------

function metingHtml(m, compact) {

// ---------- maat op een lijn: typen, inspreken of lasermeter ----------
const veldMaat = m => m.toFixed(3).replace(/0$/, '').replace('.', ',');
function maatSheet(lijn) {
  const richting = lijn.richting === 'horizontaal' ? 'horizontale' : 'verticale';
  let bron = 'hand';
  const s = sheet(`<h2>Maat voor ${richting} lijn</h2>
    <div style="display:flex;gap:16px;align-items:center">
      <label class="field" style="flex:1;margin:0"><span>Maat</span><input id="mt" inputmode="decimal" placeholder="1,50 of 1500" style="font-size:22px;font-weight:600"
        value="${lijn.maat != null ? veldMaat(lijn.maat) : ''}"></label>
      <button class="mic" id="mMic" aria-label="Inspreken">${ic('mic')}</button>
    </div>
    <div style="color:var(--muted);font-size:12px;margin:6px 0 0 12px">In meters, of in mm bij een heel getal. Zeg of typ ook "4 stijlen".</div>
    <div id="mMelding" class="melding"></div>
    <div id="mLaser" style="margin-top:14px"></div>
    <div class="actions" style="justify-content:space-between">${lijn.maat != null ? '<button id="mWis">Maat wissen</button>' : '<span></span>'}<button class="primary" id="mOk" style="width:auto;padding:12px 24px;margin:0">Opslaan</button></div>`);
  const inp = $('#mt', s), melding = $('#mMelding', s);
  inp.oninput = () => { bron = 'hand'; };
  const opslaan = () => {
    const v = inp.value.trim();
    let maat = null;
    // inp kan "1,75 4 stijlen" of alleen "4 stijlen" bevatten.
    const { aantal, rest } = splitsAantal(v);
    if (aantal != null) lijn.aantal = aantal;
    if (rest) { maat = herken(rest).eersteMaat; if (maat == null) { melding.textContent = 'Vul een maat in, bijvoorbeeld 1,50 of 1500.'; melding.classList.add('fout'); return; } }
    if (rest || aantal == null) { lijn.maat = maat; lijn.bron = maat == null ? null : bron; }
    bewaar(); afsluiten(); tekenUI();
  };
  const afsluiten = () => { Spraak.stop(); Laser.opMeting = V ? laserOpLijn : null; Laser.luisteraars.delete(laserUpdate); sluit(s); };
  s.onclick = e => { if (e.target === s) afsluiten(); };
  $('#mOk', s).onclick = opslaan;
  inp.onkeydown = e => { if (e.key === 'Enter') opslaan(); };
  if ($('#mWis', s)) $('#mWis', s).onclick = () => { inp.value = ''; opslaan(); };
  koppelMic($('#mMic', s), melding, '', tekst => {
    const { aantal, rest } = splitsAantal(tekst);
    const r = herken(rest);
    if (r.eersteMaat != null) { inp.value = veldMaat(r.eersteMaat); bron = 'spraak'; }
    if (aantal != null) { lijn.aantal = aantal; bewaar(); tekenUI(); if (r.eersteMaat == null && lijn.maat != null) inp.value = veldMaat(lijn.maat); }
    const type = V && typeUitTekst(rest, V.s.naam);
    if (type) { foto().type = type; bewaar(); tekenUI(); melding.textContent = `"${tekst}" → ${type.code} ${type.naam}`; return; }
    melding.textContent = r.eersteMaat != null || aantal != null ? `"${tekst}"` + (aantal != null ? ` → ${aantal} stijlen` : '') : `Geen maat verstaan in "${tekst}".`;
  });
  const laserUpdate = () => { $('#mLaser', s).innerHTML = laserKnopHtml(); koppelLaserKnop($('#mLaser', s)); };
  Laser.luisteraars.add(laserUpdate); laserUpdate();
  // Laser: direct opslaan zonder bevestiging en door naar de volgende open lijn.
  Laser.opMeting = m => { afsluiten(); V.sel = lijn.id; laserOpLijn(m); };
}

  // Versturen: de PDF wordt in het geheugen gemaakt en direct aan het deelscherm gegeven (WhatsApp, mail enz.).
  // Er wordt niets gedownload; daarvoor zijn de knoppen "Alleen PDF/Excel opslaan".
  $('#rpStuur').onclick = () => exporteer('stuur', async () => {
    const blob = await maakPdf(p, posten);
    if (!await deelPdf(blob, bestandsnaam(p, 'pdf'), `Opname ${p.werknummer}, ${p.adres}`, mailTekst(p))) return;
    p.verstuurd = new Date().toISOString(); RP.projectId = p.id; bewaar();
    // In de app daarna stil een back-up van dit project in het BuildCalc-mapje (geen download).
    if (Native) await backupMaken(p, true);
  });
  const ov = $('#rpOngedaan'); if (ov) ov.onclick = () => { delete p.verstuurd; bewaar(); render(); };
  m.querySelectorAll('[data-leer]').forEach(b => b.onclick = () => woordLeren(regels[+b.dataset.leer].opmerking));
  m.querySelectorAll('[data-sleutel]').forEach(b => b.onclick = () => {
    const k = b.dataset.sleutel, huidig = koppelingen.find(([x]) => x === k)[1];
    const standaard = postCode(postenVoorNotitie(huidig.opmerking, huidig.locatie, () => null)[0]);
    const d = dialoog(`<h2>${esc(sleutelLabel(k))}</h2><label class="field"><span>Topcalc-code (object en onderdeel)</span><input id="cd" value="${esc(postCode(huidig))}" autocapitalize="characters"></label>
      <div id="cdi" style="font-size:13px;min-height:36px"></div>
      <div class="actions"><button id="cst">Standaard</button><button id="cx">Annuleren</button><button id="cok" class="primary">Opslaan</button></div>`);
    const inp = $('#cd', d), info = $('#cdi', d), okKnop = $('#cok', d);
    const toon = () => {
      const z = zoekCode(inp.value);
      info.innerHTML = z ? `<span style="color:var(--gold)">${esc(z[0].naam)}, ${esc(z[1].naam)} (${z[1].eenheid.toLowerCase()})</span>`
        : `<span style="color:var(--danger)">Code niet gevonden in de Topcalc-lijst</span>`;
      okKnop.disabled = !z;
    };
    toon(); inp.oninput = toon; inp.focus(); inp.select();
    const ok = () => { if (!zoekCode(inp.value)) return; zetCode(k, inp.value === standaard ? '' : inp.value); sluit(d); render(); };
    okKnop.onclick = ok; $('#cx', d).onclick = () => sluit(d);
    $('#cst', d).onclick = () => { zetCode(k, ''); sluit(d); render(); };
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}

// ---------- kleine UI-hulpjes ----------
function sheet(html) {
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="sheet"><div class="handle"></div>${html}</div>`;
  s.onclick = e => { if (e.target === s) sluit(s); };
  document.body.appendChild(s); return s;
}
function dialoog(html, bijSluiten) {
  const s = document.createElement('div'); s.className = 'scrim center';
  s.innerHTML = `<div class="dialog">${html}</div>`;
  s.onclick = e => { if (e.target === s) { sluit(s); bijSluiten?.(); } };
  document.body.appendChild(s); return s;
}
const sluit = s => s.remove();
function menu(items) {
  const s = sheet('<div class="menu">' + items.map(([i, l], n) =>
    `<button data-n="${n}" style="${i === 'trash' ? 'color:var(--danger)' : ''}"><span style="color:${i === 'trash' ? 'var(--danger)' : 'var(--gold)'}">${ic(i)}</span>${l}</button>`).join('') + '</div>');
  s.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { sluit(s); items[+b.dataset.n][2](); });
}
function bevestig(titel, tekst, { ja = 'Verwijderen', nee = 'Annuleren', klasse = 'danger' } = {}) {
  return new Promise(res => {
    const d = dialoog(`<h2>${titel}</h2><div style="color:var(--muted)">${esc(tekst)}</div>
      <div class="actions"><button id="nee">${nee}</button><button id="ja" class="${klasse}">${ja}</button></div>`, () => res(false));
    $('#nee', d).onclick = () => { sluit(d); res(false); };
    $('#ja', d).onclick = () => { sluit(d); res(true); };
  });
}
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3500);
}

// Alleen de bediening wordt vertaald. Spraakherkenning, schilderstermen, Topcalc-codes en het rapport blijven Nederlands.
const TAAL_KEY = 'buildcalc.taal', THEMA_KEY = 'buildcalc.thema';
const leesInst = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
let taal = leesInst(TAAL_KEY, 'nl'), thema = leesInst(THEMA_KEY, 'donker');
function zetThema(t) {
  thema = t; try { localStorage.setItem(THEMA_KEY, t); } catch {}
  document.documentElement.dataset.theme = t === 'licht' ? 'light' : 'dark';
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', t === 'licht' ? '#F6F4EF' : '#121212');
}
zetThema(thema);

const VERTAAL_PATRONEN = [
  [/^(\d+) projecten?$/, "$1 projects", "$1 Projekte"],
  [/^1 project$/, "1 project", "1 Projekt"],

  [/^Verstuurd op (.+)$/, "Sent on $1", "Gesendet am $1"],
  [/^Versturen: (.+)$/, "Send: $1", "Senden: $1"],
  [/^SUBMAPPEN \((\d+)\)$/, "SUBFOLDERS ($1)", "UNTERORDNER ($1)"],
  [/^Geleerd \((\d+)\)$/, "Learned ($1)", "Gelernt ($1)"],
  [/^INVOERLIJST TOPCALC \((\d+)\)$/, "TOPCALC ENTRY LIST ($1)", "TOPCALC-EINGABELISTE ($1)"],
  [/^(\d+) lijnen \((\d+) open\)$/, "$1 lines ($2 open)", "$1 Linien ($2 offen)"],
  [/^(\d+) lijnen$/, "$1 lines", "$1 Linien"],
  [/^1 lijn$/, "1 line", "1 Linie"],
  [/^1 lijn \(1 open\)$/, "1 line (1 open)", "1 Linie (1 offen)"],
  [/^(\d+) keer verbeterd$/, "corrected $1 times", "$1-mal korrigiert"],
  [/^Maat (\d.*)$/, "Measurement $1", "Maß $1"],
  [/^Foto (\d+)$/, "Photo $1", "Foto $1"],
  [/^Verstuurd$/, "Sent", "Gesendet"],
  [/^NOTITIES (.+) \((\d+)\)$/, "NOTES $1 ($2)", "NOTIZEN $1 ($2)"],
  [/^Opslaan in (.+)$/, "Save in $1", "Speichern in $1"],
  [/^(\d+) foto\'s$/, "$1 photos", "$1 Fotos"],
  [/^1 foto$/, "1 photo", "1 Foto"],
  [/^Foto\'s: (.+)$/, "Photos: $1", "Fotos: $1"],
  [/^(.+) verbonden$/, "$1 connected", "$1 verbunden"],
  [/^Let op: bij (\d+) opnames of lijnen ontbreekt nog een maat$/, "Note: $1 entries or lines still lack a measurement", "Achtung: Bei $1 Aufnahmen oder Linien fehlt noch ein Maß"],
  [/^Let op: bij 1 opname of lijn ontbreekt nog een maat$/, "Note: 1 entry or line still lacks a measurement", "Achtung: Bei 1 Aufnahme oder Linie fehlt noch ein Maß"],
  [/^\+ (\d+) zonder maat$/, "+ $1 without measurement", "+ $1 ohne Maß"],
  [/^(\d+) opnames? zonder maat$/, "$1 entry(s) without measurement", "$1 Aufnahme(n) ohne Maß"],

];
const ontbreekt = new Set(), bekend = new Set(Object.values(VERTALING).flat());
function vertaalKern(k, i, diep = 0) {
  if (k in VERTALING) return VERTALING[k][i];
  if (bekend.has(k)) return null;
  for (const [re, ...v] of VERTAAL_PATRONEN) {
    const m = k.match(re);
    if (m) return v[i].replace(/\$(\d)/g, (_, n) => { const d = m[+n] ?? ''; return vertaalKern(d, i, diep + 1) ?? d; });
  }
  for (const sep of [' • ', '. ']) if (k.includes(sep)) {
    const delen = k.split(sep), uit = delen.map(d => d.trim() ? vertaalKern(d.trim(), i, diep + 1) : d);
    if (uit.some(x => x != null)) return uit.map((x, n) => x ?? delen[n]).join(sep);
  }
  if (!diep && /[a-z]{3}/i.test(k) && !/^\d/.test(k)) ontbreekt.add(k);
  return null;
}
function vertaalTekst(t) {
  const k = t.trim(); if (!k || taal === 'nl') return t;
  const v = vertaalKern(k, taal === 'en' ? 0 : 1);
  return v == null || v === k ? t : t.replace(k, v);
}
// Gebruikersgegevens (namen, notities, invoer) en maatlijnen nooit vertalen.
const nietVertalen = el => !el || !!el.closest?.('[data-nt], svg, textarea, option[data-nt]');
const gesloten = el => !!el.closest?.('[data-nt], svg');
function vertaalBoom(root) {
  if (taal === 'nl' || !root) return;
  if (root.nodeType === 3) { if (!nietVertalen(root.parentElement)) { const v = vertaalTekst(root.data); if (v !== root.data) root.data = v; } return; }
  if (root.nodeType !== 1 || gesloten(root)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.nodeType === 1 ? (gesloten(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) : nietVertalen(n.parentElement) ? NodeFilter.FILTER_SKIP : NodeFilter.FILTER_ACCEPT });
  for (let n = root; n; n = w.nextNode()) {
    if (n.nodeType === 3) { const v = vertaalTekst(n.data); if (v !== n.data) n.data = v; continue; }
    for (const a of ['placeholder', 'aria-label', 'title']) if (n.hasAttribute?.(a)) { const v = vertaalTekst(n.getAttribute(a)); if (v !== n.getAttribute(a)) n.setAttribute(a, v); }
  }
}
new MutationObserver(lijst => { if (taal === 'nl') return; for (const m of lijst) {
  if (m.type === 'characterData') vertaalBoom(m.target); else m.addedNodes.forEach(vertaalBoom);
} }).observe(document.body, { childList: true, subtree: true, characterData: true });
function zetTaal(t) { taal = t; try { localStorage.setItem(TAAL_KEY, t); } catch {} document.documentElement.lang = t; }
document.documentElement.lang = taal;
